services:
  api:
    build: .
    command: uvicorn beanbot.api.app:create_app --factory --host 0.0.0.0 --port 8000 --workers 1 --reload
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATA_DIR: /app/data
      LEDGER_ROOT: /app/ledgers
    volumes:
      - ./beanbot:/app/beanbot
      - ./data:/app/data
      - ./ledgers:/app/ledgers
